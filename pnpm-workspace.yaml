packages:
- packages/*
- plugins/*
- playground
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@seedcord/core@0.11.0'
  - '@seedcord/custom-id@0.3.0'
  - '@seedcord/errors@0.14.0'
  - '@seedcord/event-emitter@0.2.0'
  - '@seedcord/logger@0.5.0'
  - '@seedcord/types@0.15.0'
  - '@seedcord/utils@0.9.0'
  - envapt@9.2.0
  - '@seedcord/eslint-config@3.0.0'
  - '@seedcord/eslint-plugin@0.5.0'
  - '@seedcord/gateway@0.8.0'
  - '@seedcord/rate-limiter@0.2.0'
  - '@seedcord/tsconfig@3.0.0'
  - es-toolkit@1.53.0
  - eslint-plugin-discordjs@0.2.0
  - seedcord@0.22.0
